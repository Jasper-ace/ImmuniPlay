name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    name: Build Android APK

    runs-on: self-hosted


    steps:


      #=========================================
      # Checkout Repository
      #=========================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true



      #=========================================
      # Cache Unity Library
      #=========================================
      - name: Cache Library
        uses: actions/cache@v4
        with:

          path: Library

          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

          restore-keys: |
            Library-Android-



      #=========================================
      # Check Workspace
      #=========================================
      - name: Check Project
        shell: powershell
        run: |

          Write-Host "========== WORKSPACE =========="

          Write-Host "${{ github.workspace }}"


          Write-Host ""

          Get-ChildItem "${{ github.workspace }}" -Force



      #=========================================
      # Check Unity
      #=========================================
      - name: Check Unity Installation
        shell: powershell
        run: |

          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"


          if(!(Test-Path $unity))
          {
              throw "Unity not found"
          }


          Write-Host "Unity Found"

          & $unity -version



      #=========================================
      # Build APK
      #=========================================
      - name: Build APK
        shell: powershell
        run: |

          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"

          $project = "${{ github.workspace }}"

          $log = "$project\unity-build.log"



          Write-Host "========== UNITY INFO =========="

          Write-Host "Unity:"
          Write-Host $unity

          Write-Host ""

          Write-Host "Project:"
          Write-Host $project



          if(Test-Path $log)
          {
              Remove-Item $log -Force
          }



          Write-Host ""

          Write-Host "========== START UNITY BUILD =========="



          $arguments = @(
              "-batchmode",
              "-nographics",
              "-quit",
              "-projectPath",
              $project,
              "-executeMethod",
              "BuildScript.BuildAndroid",
              "-logFile",
              $log
          )


          $process = Start-Process `
              -FilePath $unity `
              -ArgumentList $arguments `
              -Wait `
              -PassThru `
              -NoNewWindow



          Write-Host ""

          Write-Host "========== UNITY EXIT CODE =========="

          Write-Host $process.ExitCode



          Write-Host ""

          if(Test-Path $log)
          {

              Write-Host "========== UNITY LOG =========="

              Get-Content $log

          }
          else
          {

              Write-Host "UNITY LOG WAS NOT CREATED"

          }


          exit $process.ExitCode




      #=========================================
      # Find APK
      #=========================================
      - name: Find APK Output
        shell: powershell
        run: |

          Write-Host "========== SEARCHING APK =========="



          $apk = Get-ChildItem `
              "${{ github.workspace }}" `
              -Recurse `
              -Filter *.apk `
              -ErrorAction SilentlyContinue



          if($apk.Count -eq 0)
          {

              Write-Host "NO APK FOUND"

              exit 1

          }


          foreach($file in $apk)
          {

              Write-Host $file.FullName

          }



      #=========================================
      # Upload Unity Log
      #=========================================
      - name: Upload Unity Log
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: Unity-Build-Log

          path: unity-build.log



      #=========================================
      # Upload APK
      #=========================================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: ImmuniPlay-APK

          path: |
            **/*.apk