name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: self-hosted

    steps:
      #=========================================
      # Checkout
      #=========================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      #=========================================
      # Cache Unity Library
      #=========================================
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      #=========================================
      # Debug Workspace
      #=========================================
      - name: Debug Workspace
        shell: powershell
        run: |
          Write-Host "========== GITHUB WORKSPACE =========="
          Write-Host $env:GITHUB_WORKSPACE
          Write-Host ""

          Write-Host "========== ROOT FILES =========="
          Get-ChildItem $env:GITHUB_WORKSPACE -Force

          Write-Host ""
          Write-Host "========== ASSETS =========="
          if (Test-Path "$env:GITHUB_WORKSPACE\Assets") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\Assets"
          } else {
            Write-Host "Assets folder NOT FOUND!"
          }

          Write-Host ""
          Write-Host "========== PACKAGES =========="
          if (Test-Path "$env:GITHUB_WORKSPACE\Packages") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\Packages"
          } else {
            Write-Host "Packages folder NOT FOUND!"
          }

      #=========================================
      # Check Unity Installation
      #=========================================
      - name: Check Unity Installation
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"

          if (!(Test-Path $unity)) {
            throw "Unity not found: $unity"
          }

          Write-Host "Unity Found:"
          Get-Item $unity

          Write-Host ""
          Write-Host "Unity Version:"
          & $unity -version

      #=========================================
      # Build APK
      #=========================================
      - name: Build APK
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"

          Write-Host ""
          Write-Host "========== STARTING UNITY BUILD =========="

          & $unity `
            -batchmode `
            -projectPath "${{ github.workspace }}" `
            -executeMethod BuildScript.BuildAndroid `
            -logFile -

          $exitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Unity Exit Code: $exitCode"
          Write-Host "=========================================="

          exit $exitCode

      #=========================================
      # Upload APK
      #=========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmuniPlay-APK
          path: build/ImmuniPlay.apk