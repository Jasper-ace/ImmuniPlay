name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: self-hosted

    steps:
      #=========================================
      # Checkout Repository
      #=========================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      #=========================================
      # Cache Unity Library
      #=========================================
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      #=========================================
      # Debug Workspace
      #=========================================
      - name: Debug Workspace
        shell: powershell
        run: |
          Write-Host "========== GITHUB WORKSPACE =========="
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "========== ROOT =========="
          Get-ChildItem $env:GITHUB_WORKSPACE -Force

      #=========================================
      # Check Unity
      #=========================================
      - name: Check Unity Installation
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"

          if (!(Test-Path $unity)) {
            throw "Unity not found: $unity"
          }

          & $unity -version

      #=========================================
      # Build APK
      #=========================================
      - name: Build APK
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"

          Write-Host "========== START BUILD =========="

          & $unity `
            -batchmode `
            -projectPath "${{ github.workspace }}" `
            -executeMethod BuildScript.BuildAndroid `
            -logFile -

          exit $LASTEXITCODE

      #=========================================
      # Find APK
      #=========================================
      - name: Find Build Output
        shell: powershell
        run: |
          Write-Host "========== BUILD DIRECTORY =========="

          if (Test-Path "${{ github.workspace }}\build") {
            Get-ChildItem "${{ github.workspace }}\build" -Recurse -Force
          }
          else {
            Write-Host "build folder does not exist."
          }

          Write-Host ""
          Write-Host "========== APK FILES =========="

          $apks = Get-ChildItem "${{ github.workspace }}" -Recurse -Filter *.apk

          if ($apks.Count -eq 0) {
            throw "NO APK FOUND!"
          }

          foreach ($apk in $apks) {
            Write-Host $apk.FullName
          }

      #=========================================
      # Upload APK Artifact
      #=========================================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmuniPlay-APK
          path: |
            **/*.apk

      #=========================================
      # Upload APK to GitHub Release
      #=========================================
      - name: Upload APK to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: |
            **/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}