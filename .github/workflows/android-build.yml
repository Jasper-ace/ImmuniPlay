name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:

  build:

    name: Build Android APK

    runs-on: self-hosted


    steps:

      #=========================================
      # Checkout
      #=========================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true


      #=========================================
      # Cache Unity Library
      #=========================================
      - name: Cache Library
        uses: actions/cache@v4
        with:

          path: Library

          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

          restore-keys: |
            Library-Android-


      #=========================================
      # Check Unity
      #=========================================
      - name: Check Unity Installation
        shell: powershell
        run: |

          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"


          if (!(Test-Path $unity)) {

              throw "Unity not found: $unity"

          }


          Write-Host "Unity Found"

          & $unity -version



      #=========================================
      # Build APK
      #=========================================
      - name: Build APK
        shell: powershell
        run: |

          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"


          Write-Host "========== START UNITY BUILD =========="


          & $unity `
            -batchmode `
            -nographics `
            -quit `
            -projectPath "${{ github.workspace }}" `
            -executeMethod BuildScript.BuildAndroid `
            -logFile "${{ github.workspace }}\unity-build.log"


          $exitCode = $LASTEXITCODE


          Write-Host ""
          Write-Host "========== UNITY EXIT CODE =========="
          Write-Host $exitCode


          if(Test-Path "${{ github.workspace }}\unity-build.log")
          {

              Write-Host ""
              Write-Host "========== UNITY LOG =========="

              Get-Content "${{ github.workspace }}\unity-build.log"

          }
          else
          {

              Write-Host "Unity log was not created"

          }


          exit $exitCode



      #=========================================
      # Debug APK Output
      #=========================================
      - name: Check Build Files
        shell: powershell
        run: |

          Write-Host "========== SEARCHING APK =========="


          $apkFiles = Get-ChildItem `
            "${{ github.workspace }}" `
            -Recurse `
            -Include *.apk `
            -ErrorAction SilentlyContinue


          if($apkFiles.Count -eq 0)
          {

              Write-Host "NO APK FOUND"

          }
          else
          {

              foreach($apk in $apkFiles)
              {

                  Write-Host $apk.FullName

              }

          }


          Write-Host ""
          Write-Host "========== BUILD FOLDER =========="


          if(Test-Path "${{ github.workspace }}\build")
          {

              Get-ChildItem "${{ github.workspace }}\build" -Recurse

          }
          else
          {

              Write-Host "No build folder created"

          }



      #=========================================
      # Upload Build Log
      #=========================================
      - name: Upload Unity Log
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: Unity-Build-Log

          path: unity-build.log



      #=========================================
      # Upload APK Artifact
      #=========================================
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:

          name: ImmuniPlay-APK

          path: |
            **/*.apk



      #=========================================
      # Upload APK To GitHub Release
      #=========================================
      - name: Upload APK To Release
        if: success()
        uses: softprops/action-gh-release@v2

        with:

          tag_name: v1.0.0

          files: |
            **/*.apk

          fail_on_unmatched_files: true


        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}