name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Debug Workspace
        shell: powershell
        run: |
          Write-Host "========== GITHUB WORKSPACE =========="
          Write-Host $env:GITHUB_WORKSPACE
          Write-Host ""

          Write-Host "========== ROOT FILES =========="
          Get-ChildItem $env:GITHUB_WORKSPACE -Force

          Write-Host ""
          Write-Host "========== ASSETS =========="
          if (Test-Path "$env:GITHUB_WORKSPACE\Assets") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\Assets"
          } else {
            Write-Host "Assets folder NOT FOUND!"
          }

          Write-Host ""
          Write-Host "========== PACKAGES =========="
          if (Test-Path "$env:GITHUB_WORKSPACE\Packages") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\Packages"
          } else {
            Write-Host "Packages folder NOT FOUND!"
          }

      - name: Build APK
        shell: powershell
        run: |
          $unity = "C:\Program Files\Unity\Hub\Editor\6000.3.8f1\Editor\Unity.exe"

          if (!(Test-Path $unity)) {
            throw "Unity not found: $unity"
          }

          & $unity `
            -batchmode `
            -quit `
            -projectPath "${{ github.workspace }}" `
            -executeMethod BuildScript.BuildAndroid `
            -logFile build.log

          if ($LASTEXITCODE -ne 0) {
            if (Test-Path build.log) {
              Get-Content build.log
            } else {
              Write-Host "build.log not found."
            }
            throw "Unity build failed."
          }

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmuniPlay-APK
          path: build/ImmuniPlay.apk